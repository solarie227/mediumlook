name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: ツールのバージョン
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Metal シェーダーの確認
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          ./scripts/check_shaders.sh
      - name: swift build
        run: swift build -c release
      - name: .app にまとめる
        run: ./build_app.sh

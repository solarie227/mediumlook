name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: ツールのバージョン
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: swift build
        run: swift build -c release
      - name: .app にまとめる
        run: ./build_app.sh
